# Автоматичне збирання портабельних версій для Windows, macOS і Linux.
# Запускається вручну (вкладка Actions → Build → Run workflow) або при push тегу v*.
# Готові zip-архіви з'являються в розділі Artifacts запуску.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Системні бібліотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: Тести
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Збирання
        run: python build_app.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: SpecRec-${{ runner.os }}
          path: dist/*.zip
